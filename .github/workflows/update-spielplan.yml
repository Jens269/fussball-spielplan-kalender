name: Update Spielplan

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-spielplan
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Spielplaene abrufen und ICS erzeugen
        run: ./scripts/Update-Spielplan.ps1 -TeamsConfigPath ./config/teams.json -OutputPath ./ics

      - name: Guard – niemals leere/fehlende Kalender committen
        run: |
          $teams = Get-Content ./config/teams.json -Raw | ConvertFrom-Json -AsHashtable
          $failed = $false
          foreach ($teamName in $teams.Keys) {
            $path = "./ics/$teamName.ics"
            if (-not (Test-Path $path)) {
              Write-Error "Fehlt: $path"
              $failed = $true
              continue
            }
            $item = Get-Item $path
            if ($item.Length -eq 0) {
              Write-Error "Leer: $path"
              $failed = $true
              continue
            }
            if (-not (Select-String -Path $path -Pattern '^BEGIN:VEVENT$' -Quiet)) {
              Write-Error "Kein einziges VEVENT in $path"
              $failed = $true
            }
          }
          if ($failed) {
            throw 'Guard fehlgeschlagen: mindestens eine Kalenderdatei ist leer oder fehlt. Es wird NICHT committet.'
          }

      - name: Aenderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ics/
          if (git diff --staged --quiet) {
            Write-Host "Keine Aenderungen an den Kalendern - nichts zu committen."
          }
          else {
            git commit -m "Spielplaene aktualisiert ($(Get-Date -AsUTC -Format 'yyyy-MM-dd')) "
            git push
          }
